name: R36S aarch64 build

# Se ejecuta a mano: pestaña Actions -> "R36S aarch64 build" -> Run workflow
# La imagen decide la glibc del binario: ubuntu:20.04 = glibc 2.31 (corre en sistemas con glibc >= 2.31).
on:
  workflow_dispatch:
    inputs:
      image:
        description: "Imagen de compilacion (su glibc debe ser igual o menor que la de la consola)"
        default: "ubuntu:20.04"

jobs:
  build:
    runs-on: ubuntu-24.04-arm     # maquina ARM64 nativa (gratis en repositorios publicos)
    container: ${{ inputs.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Dependencias
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates software-properties-common gnupg \
            python3 python3-pip ninja-build pkg-config binutils \
            libdrm-dev libgbm-dev libegl-dev libgles-dev libudev-dev libasound2-dev libdbus-1-dev
          # GCC 12 (el proyecto necesita C++20) desde el PPA de toolchains
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get update
          apt-get install -y --no-install-recommends gcc-12 g++-12
          # el proyecto pide CMake >= 3.21 y esta imagen trae 3.16
          pip3 install --upgrade cmake
          g++-12 --version | head -1
          cmake --version | head -1
          ldd --version | head -1

      - uses: actions/checkout@v4

      - name: Configurar
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12 \
            -DHOTD_LINUX_GLES=ON -DHOTD_FETCH_SDL3=ON -DHOTD_SDL3_TAG=release-3.2.10 -DHOTD_FETCH_STB=ON \
            -DHOTD_EXPERIMENTAL_MODES=OFF \
            -DSDL_KMSDRM=ON -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_VULKAN=OFF \
            -DSDL_UNIX_CONSOLE_BUILD=ON \
            -DCMAKE_C_FLAGS="-O3 -mcpu=cortex-a35" \
            -DCMAKE_CXX_FLAGS="-O3 -mcpu=cortex-a35"

      - name: Compilar
        run: cmake --build build --target hotd --parallel 4

      - name: Reunir resultado
        run: |
          set -euo pipefail
          mkdir -p out/bin out/libs
          cp "$(find build -maxdepth 2 -type f -name hotd | head -1)" out/bin/hotd
          cp -a $(find build -name 'libSDL3.so*' | head -5) out/libs/
          strip out/bin/hotd
          ldd --version | head -1 > out/glibc.txt
          ldd out/bin/hotd | tee out/ldd.txt
          # la glibc MINIMA que necesita el binario en la consola (la mas alta de estas)
          { echo "hotd:"; objdump -T out/bin/hotd | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -3
            echo "libSDL3:"; objdump -T out/libs/libSDL3.so.0 | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -3; } | tee out/glibc_needed.txt
          ls -lR out

      - uses: actions/upload-artifact@v4
        with:
          name: hotd-r36s-aarch64
          path: out/
