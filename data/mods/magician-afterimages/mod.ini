; The Magician Afterimages mod (built into the game; docs/modding.md; GitHub #54). This file is its manifest: the name,
; the help line and the settings the Mods page shows. The code is the game's own (type = magician).
; Any colour: write it as #RRGGBB after the key in launcher.ini (modset.magician-afterimages.phase1=#FF00FF) or as a
; setting's default here.
[mod]
name = Magician Afterimages
author = ReWrithe
version = 1
description = The colour of the Magician's afterimages in each phase: as in the game, the rainbow, or a colour of your choice (visual only)
type = magician
default = off

[settings]
; key = label | default | choice, choice, ... | help line
phase1 = Phase 1 | Original | Original, Rainbow, Red, Orange, Yellow, Green, Cyan, Blue, Purple, Pink, White | The afterimages as he flies around (the game: blue)
phase2 = Phase 2 | Original | Original, Rainbow, Red, Orange, Yellow, Green, Cyan, Blue, Purple, Pink, White | The afterimages of his swoops and lunges (the game: red)
speed = Rainbow Speed | Normal | Slow, Normal, Fast | How fast the rainbow changes
